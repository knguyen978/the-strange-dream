<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Strange Dream</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: #000;
  color: white;
  font-family: "Times New Roman", serif;
  text-align: center;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  padding: 20px 40px;
}

header h1 {
  font-size: 20px;
  letter-spacing: 4px;
  margin-left: 10px;
}

/* ABOUT SECTION */
.about {
  margin-top: 25vh;
  padding: 0 20px;
}

.about h2 {
  font-size: 42px;
  letter-spacing: 4px;
  margin-bottom: 20px;
}

.about p {
  max-width: 700px;
  margin: auto;
  color: #ccc;
  line-height: 1.6;
}

/* SOCIAL BUTTONS */
.socials {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  flex-wrap: wrap;
  margin-top: 40px;
}

.btn {
  padding: 12px 32px;
  border: 1px solid rgba(255,255,255,0.4);
  color: white;
  text-decoration: none;
  font-size: 16px;
  letter-spacing: 2px;
  transition: all 0.3s ease;
}

.btn:hover {
  border-color: #9ecbff;
  color: #9ecbff;
  box-shadow:
    0 0 10px #9ecbff,
    0 0 20px rgba(158,203,255,0.6);
  transform: translateY(-2px);
}

/* Responsive */
@media (max-width: 600px) {
  .about h2 {
    font-size: 28px;
  }

  .btn {
    width: 200px;
    text-align: center;
  }
}
</style>
</head>

<body>

<header>
  <h1>THE STRANGE DREAM</h1>
</header>

<section class="about">
  <h2>ABOUT THE GAME</h2>
  <p>
    The Strange Dream is a mysterious experience where reality fractures after a strange disaster. 
    Familiar places decay, memories twist, and something follows you through the dream.
  </p>

  <div class="socials">
    <a href="https://x.com/thestrangedrea" target="_blank" class="btn">Twitter</a>
    <a href="https://www.youtube.com/channel/UCpa67gaD_-CoFDXHSpe48jg" target="_blank" class="btn">YouTube</a>
    <a href="https://discord.gg/ZARVXqY6dM" target="_blank" class="btn">Discord</a>
  </div>
</section>

</body>
</html>
